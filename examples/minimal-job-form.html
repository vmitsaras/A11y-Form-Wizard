  <body class="a11y-form-wizard-demo">
    <main>
      <section class="a11y-form-wizard" data-a11y-form-wizard aria-labelledby="minimal-title">
        <div class="a11y-form-wizard__shell">
          <div class="a11y-form-wizard__layout">
            <header class="a11y-form-wizard__header">
              <p class="a11y-form-wizard__eyebrow">Example</p>
              <h1 class="a11y-form-wizard__headline" id="minimal-title">
                Minimal job form
              </h1>
              <p class="a11y-form-wizard__lede">
                A compact two-step application using the same plugin contract.
              </p>
            </header>

            <form class="a11y-form-wizard__form" action="/api/job-application" method="post">
              <input type="hidden" name="job_title" value="Retail Associate" />

              <div class="a11y-form-wizard__progress-wrap" aria-label="Application progress">
                <progress
                  class="a11y-form-wizard__progress"
                  max="2"
                  value="1"
                  aria-label="Application progress"
                  data-a11y-form-wizard-progress
                ></progress>
                <p class="a11y-form-wizard__progress-label">
                  Step
                  <span data-a11y-form-wizard-current-step>1</span> of
                  <span data-a11y-form-wizard-total-steps>2</span>
                </p>
              </div>

              <div class="a11y-form-wizard__error-summary" data-a11y-form-wizard-error-summary hidden></div>
              <div class="a11y-form-wizard__sr-only" data-a11y-form-wizard-live aria-live="polite"></div>

              <fieldset class="a11y-form-wizard__step" data-a11y-form-wizard-step>
                <legend class="a11y-form-wizard__sr-only">Retail availability</legend>
                <p class="a11y-form-wizard__step-kicker">Availability</p>
                <h2 class="a11y-form-wizard__title" data-a11y-form-wizard-step-heading>
                  Are you available for weekend shifts?
                </h2>

                <div class="a11y-form-wizard__choices">
                  <label class="a11y-form-wizard__choice">
                    <input
                      class="a11y-form-wizard__choice-input"
                      type="radio"
                      name="weekend_availability"
                      value="Yes"
                      data-a11y-form-wizard-choice-input
                      required
                    />
                    <span class="a11y-form-wizard__choice-text">
                      <span class="a11y-form-wizard__choice-label">Yes</span>
                      <span class="a11y-form-wizard__choice-description">
                        I can work Saturdays, Sundays, or both.
                      </span>
                    </span>
                  </label>

                  <label class="a11y-form-wizard__choice">
                    <input
                      class="a11y-form-wizard__choice-input"
                      type="radio"
                      name="weekend_availability"
                      value="No"
                      data-a11y-form-wizard-choice-input
                      required
                    />
                    <span class="a11y-form-wizard__choice-text">
                      <span class="a11y-form-wizard__choice-label">No</span>
                      <span class="a11y-form-wizard__choice-description">
                        I am only available on weekdays.
                      </span>
                    </span>
                  </label>
                </div>

                <div class="a11y-form-wizard__actions">
                  <button
                    class="a11y-form-wizard__button a11y-form-wizard__button--primary"
                    type="button"
                    data-a11y-form-wizard-next
                  >
                    Continue
                  </button>
                </div>
              </fieldset>

              <fieldset
                class="a11y-form-wizard__step"
                data-a11y-form-wizard-step
                data-a11y-form-wizard-auto-advance="false"
              >
                <legend class="a11y-form-wizard__sr-only">Applicant contact</legend>
                <p class="a11y-form-wizard__step-kicker">Contact</p>
                <h2 class="a11y-form-wizard__title" data-a11y-form-wizard-step-heading>
                  Send your contact details
                </h2>

                <div class="a11y-form-wizard__fields">
                  <div class="a11y-form-wizard__field">
                    <label class="a11y-form-wizard__field-label" for="minimal-name">
                      Full name
                    </label>
                    <div class="a11y-form-wizard__field-shell">
                      <input
                        class="a11y-form-wizard__input"
                        id="minimal-name"
                        name="full_name"
                        type="text"
                        autocomplete="name"
                        required
                      />
                    </div>
                  </div>

                  <div class="a11y-form-wizard__field">
                    <label class="a11y-form-wizard__field-label" for="minimal-email">
                      Email
                    </label>
                    <div class="a11y-form-wizard__field-shell">
                      <input
                        class="a11y-form-wizard__input"
                        id="minimal-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="a11y-form-wizard__actions">
                  <button
                    class="a11y-form-wizard__button a11y-form-wizard__button--secondary"
                    type="button"
                    data-a11y-form-wizard-previous
                  >
                    Back
                  </button>
                  <button
                    class="a11y-form-wizard__button a11y-form-wizard__button--primary"
                    type="submit"
                  >
                    Submit
                  </button>
                </div>

                <p
                  class="a11y-form-wizard__success"
                  data-a11y-form-wizard-success
                  tabindex="-1"
                  hidden
                ></p>
              </fieldset>
            </form>
          </div>
        </div>
      </section>
