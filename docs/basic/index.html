  <body class="a11y-form-wizard-demo">
    <main>
      <section class="a11y-form-wizard" data-a11y-form-wizard aria-labelledby="wizard-title">
        <div class="a11y-form-wizard__shell">
          <div class="a11y-form-wizard__layout">
            <header class="a11y-form-wizard__header">
              <p class="a11y-form-wizard__eyebrow">Example</p>
              <h1 class="a11y-form-wizard__headline" id="wizard-title">
                Basic form wizard
              </h1>
              <p class="a11y-form-wizard__lede">
                A two-step form that works as meaningful markup before JavaScript runs.
              </p>
            </header>

            <form class="a11y-form-wizard__form" action="/example" method="post">
              <div class="a11y-form-wizard__progress-wrap" aria-label="Form progress">
                <progress
                  class="a11y-form-wizard__progress"
                  max="2"
                  value="1"
                  aria-label="Form progress"
                  data-a11y-form-wizard-progress
                ></progress>
                <p class="a11y-form-wizard__progress-label">
                  Step <span data-a11y-form-wizard-current-step>1</span> of
                  <span data-a11y-form-wizard-total-steps>2</span>
                </p>
              </div>

              <div class="a11y-form-wizard__error-summary" data-a11y-form-wizard-error-summary hidden></div>
              <div class="a11y-form-wizard__sr-only" data-a11y-form-wizard-live></div>

              <fieldset class="a11y-form-wizard__step" data-a11y-form-wizard-step>
                <legend>Contact preference</legend>
                <h2 class="a11y-form-wizard__title" data-a11y-form-wizard-step-heading>
                  How should we contact you?
                </h2>

                <div class="a11y-form-wizard__choices">
                  <label class="a11y-form-wizard__choice">
                    <input
                      class="a11y-form-wizard__choice-input"
                      type="radio"
                      name="contact_preference"
                      value="email"
                      required
                      data-a11y-form-wizard-choice-input
                    />
                    <span class="a11y-form-wizard__choice-text">
                      <span class="a11y-form-wizard__choice-label">Email</span>
                      <span class="a11y-form-wizard__choice-description">Send updates by email.</span>
                    </span>
                  </label>

                  <label class="a11y-form-wizard__choice">
                    <input
                      class="a11y-form-wizard__choice-input"
                      type="radio"
                      name="contact_preference"
                      value="phone"
                      required
                      data-a11y-form-wizard-choice-input
                    />
                    <span class="a11y-form-wizard__choice-text">
                      <span class="a11y-form-wizard__choice-label">Phone</span>
                      <span class="a11y-form-wizard__choice-description">Call when something needs attention.</span>
                    </span>
                  </label>
                </div>

                <div class="a11y-form-wizard__actions">
                  <button class="a11y-form-wizard__button a11y-form-wizard__button--primary" type="button" data-a11y-form-wizard-next>
                    Continue
                  </button>
                </div>
              </fieldset>

              <fieldset class="a11y-form-wizard__step" data-a11y-form-wizard-step data-a11y-form-wizard-auto-advance="false">
                <legend>Your details</legend>
                <h2 class="a11y-form-wizard__title" data-a11y-form-wizard-step-heading>
                  Where should we send the reply?
                </h2>

                <div class="a11y-form-wizard__fields">
                  <div class="a11y-form-wizard__field">
                    <label class="a11y-form-wizard__field-label" for="basic-name">Full name</label>
                    <div class="a11y-form-wizard__field-shell">
                      <input class="a11y-form-wizard__input" id="basic-name" name="name" autocomplete="name" required />
                    </div>
                  </div>

                  <div class="a11y-form-wizard__field">
                    <label class="a11y-form-wizard__field-label" for="basic-email">Email</label>
                    <div class="a11y-form-wizard__field-shell">
                      <input class="a11y-form-wizard__input" id="basic-email" name="email" type="email" autocomplete="email" required />
                    </div>
                  </div>
                </div>

                <div class="a11y-form-wizard__actions">
                  <button class="a11y-form-wizard__button a11y-form-wizard__button--secondary" type="button" data-a11y-form-wizard-previous>
                    Back
                  </button>
                  <button class="a11y-form-wizard__button a11y-form-wizard__button--primary" type="submit">
                    Submit
                  </button>
                </div>

                <p class="a11y-form-wizard__success" data-a11y-form-wizard-success tabindex="-1" hidden></p>
              </fieldset>
            </form>
          </div>
        </div>
      </section>
